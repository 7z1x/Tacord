{% extends "base.html" %}
{% block body %}
{% macro img(n) %}{{ url_for('static', filename='img/' ~ n ~ '.png') }}{% endmacro %}
<main class="relative min-h-screen overflow-hidden">
    <a href="{{ url_for('landing') }}" class="absolute top-8 left-6 sm:left-12 z-30 flex items-center gap-3">
        <img src="{{ img('logo') }}" alt="" class="h-[52px] w-auto">
        <span class="text-[31px] font-semibold tracking-tight">Tacord</span>
    </a>

    <!-- confetti + notes -->
    <div class="pointer-events-none absolute inset-0 z-0" aria-hidden="true">
        <i class="absolute w-3.5 h-3.5 rounded-sm bg-mag rotate-12" style="left:8%;top:150px"></i>
        <i class="absolute w-3 h-3 rounded-sm bg-turq -rotate-[20deg]" style="left:15%;top:420px"></i>
        <i class="absolute w-2.5 h-2.5 rounded-sm bg-mari rotate-[30deg]" style="left:24%;top:250px"></i>
        <i class="absolute w-3.5 h-3.5 rounded-sm bg-turq rotate-[25deg]" style="left:80%;top:190px"></i>
        <i class="absolute w-3 h-3 rounded-sm bg-mag -rotate-12" style="left:90%;top:430px"></i>
        <i class="absolute w-2.5 h-2.5 rounded-sm bg-purp rotate-[40deg]" style="left:72%;top:300px"></i>
        <svg class="absolute" style="left:14%;top:300px" width="36" height="47" viewBox="0 0 28 36"><ellipse cx="9" cy="28" rx="7" ry="5.5" fill="#D6246E"/><path d="M15 28V4l10 6" stroke="#D6246E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="absolute" style="right:13%;top:260px" width="42" height="54" viewBox="0 0 28 36"><ellipse cx="9" cy="28" rx="7" ry="5.5" fill="#5B2A86"/><path d="M15 28V4l10 6" stroke="#5B2A86" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <svg class="absolute" style="right:24%;top:520px" width="30" height="39" viewBox="0 0 28 36"><ellipse cx="9" cy="28" rx="7" ry="5.5" fill="#14A3A3"/><path d="M15 28V4l10 6" stroke="#14A3A3" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <section class="relative z-20 mx-auto max-w-[900px] px-6 pt-36 sm:pt-40 text-center">
        <h1 class="font-semibold tracking-[-0.035em] leading-[1.04] text-[clamp(40px,6vw,76px)]">Turn any song into <span class="text-mag-t">synced lyrics.</span></h1>
        <a href="{{ url_for('studio') }}" class="mt-8 inline-flex items-center gap-3 rounded-full bg-ink px-10 py-[18px] text-[19px] font-semibold text-cream transition hover:bg-[#FFF6E5] hover:text-ink focus-visible:outline focus-visible:outline-4 focus-visible:outline-turq">
            Let’s start
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </a>
    </section>

    <!-- stage -->
    <div class="absolute inset-x-0 bottom-0 z-10 h-[470px]">
        <div class="absolute left-1/2 rounded-full bg-mari" style="bottom:-420px;width:min(900px,120vw);height:min(900px,120vw);margin-left:calc(min(900px,120vw) / -2)" aria-hidden="true"></div>
        <div class="absolute left-1/2 rounded-full border-[16px] border-[#E48A06]" style="bottom:-300px;width:min(660px,88vw);height:min(660px,88vw);margin-left:calc(min(660px,88vw) / -2)" aria-hidden="true"></div>
        <div class="absolute inset-x-0 -bottom-1.5 flex items-end justify-center px-4">
            <img src="{{ img('girl') }}" alt="Gadis bermahkota marigold bernyanyi sambil bermain gitar" class="w-auto -mr-[2%] -rotate-3" style="height:clamp(140px,25vw,360px)">
            <img src="{{ img('boy') }}" alt="Anak mariachi meniup trompet" class="w-auto -mr-[1%]" style="height:clamp(155px,28vw,400px)">
            <img src="{{ img('axo') }}" alt="Axolotl berheadphone memegang marakas" class="w-auto -mr-[1%] mb-[2%]" style="height:clamp(130px,23vw,330px)">
            <img src="{{ img('skull') }}" alt="Calavera kecil yang ramah bermain biola" class="w-auto rotate-3" style="height:clamp(145px,26vw,380px)">
        </div>
    </div>
</main>
{% endblock %}
