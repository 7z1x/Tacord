<div class="px-8 sm:px-14 pt-4 z-10 flex items-center gap-3.5">
<svg class="w-9 h-9 text-primary flex-shrink-0" fill="none" viewbox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
<path d="M4 25C4 13.9543 12.9543 5 24 5C27.5 5 30.5 6 32 7.5C23 8.5 16 15 15 25C15 26.5 15.2 28 15.6 29.5C9 29.5 4 27.5 4 25Z" fill="#000000"></path>

<span class="font-headline-md text-headline-md tracking-tight font-bold text-primary">Tacord</span>
</div>
<div class="px-8 sm:px-14 py-8 z-10 max-w-xl">
<h1 class="font-display-hero text-[clamp(2.75rem,5.2vw,5.5rem)] leading-[0.95] tracking-[-0.04em] font-semibold text-primary mb-6">
          Turn any song into synced lyrics.
        </h1>

</div>
<div class="w-full px-8 sm:px-14 flex items-end justify-between gap-1.5 sm:gap-3 h-48 sm:h-64 pointer-events-none z-0">
<div class="w-full bg-primary rounded-t-full h-[65%]"></div>
<div class="w-full bg-primary rounded-t-full h-[92%]"></div>
<div class="w-full bg-primary rounded-t-full h-[48%]"></div>
<div class="w-full bg-primary rounded-t-full h-[84%]"></div>
<div class="w-full bg-primary rounded-t-full h-[100%]"></div>
<div class="w-full bg-primary rounded-t-full h-[72%]"></div>
<div class="w-full bg-primary rounded-t-full h-[88%]"></div>
<div class="w-full bg-primary rounded-t-full h-[54%]"></div>
<div class="w-full bg-primary rounded-t-full h-[96%]"></div>
<div class="w-full bg-primary rounded-t-full h-[78%]"></div>
<div class="w-full bg-primary rounded-t-full h-[60%]"></div>
<div class="w-full bg-primary rounded-t-full h-[85%]"></div>
<div class="w-full bg-primary rounded-t-full h-[40%]"></div>
<div class="w-full bg-primary rounded-t-full h-[70%]"></div>
</div>
</div>
<!-- RIGHT PANEL -->
<div class="w-full lg:h-screen lg:overflow-y-auto bg-surface-container-lowest flex flex-col items-center py-10 sm:py-14 px-6 sm:px-10">
<div class="max-w-[520px] w-full flex flex-col">
<div class="flex items-center gap-10 mb-10 pb-2">
<button class="font-title-sm text-title-sm pb-2 font-medium text-primary border-b-2 border-primary cursor-pointer transition" id="tab-btn-generate" onclick="switchTab('generate')">Generate</button>
<button class="font-title-sm text-title-sm pb-2 font-medium text-outline-variant hover:text-primary cursor-pointer transition" id="tab-btn-progress" onclick="switchTab('progress')">Progress</button>
<button class="font-title-sm text-title-sm pb-2 font-medium text-outline-variant hover:text-primary cursor-pointer transition" id="tab-btn-hasil" onclick="switchTab('hasil')">Hasil</button>
</div>
<!-- VIEW GENERATE -->
<div class="flex flex-col gap-7 w-full" id="view-generate">
<div class="flex flex-col">
<label class="font-body-md text-body-md font-medium text-primary mb-2 flex items-center gap-1" for="media-url">Link YouTube / Path Audio Lokal <span class="text-error">*</span></label>
<input class="w-full h-14 px-4 text-base font-body-md text-primary bg-surface-container-lowest rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition placeholder:text-on-surface-variant/50" id="media-url" name="sumber" placeholder="https://youtube.com/watch?v=... atau path/audio.wav" type="text">
</div>
<div class="flex flex-col">
<label class="font-body-md text-body-md font-medium text-primary mb-2 flex items-center gap-1" for="lyric-select">File Lirik <span class="text-error">*</span></label>
<div class="relative w-full">
<select class="w-full h-14 pl-4 pr-10 text-base font-body-md text-primary bg-surface-container-lowest rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition cursor-pointer" id="lyric-select" name="lyric">
<option value="" disabled selected>Pilih lirik</option>
{% for ly in lyrics %}
<option value="{{ ly }}">{{ ly }}</option>
{% endfor %}
<option value="__import__">Import file lirik... (Upload)</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-primary">expand_more</span>
</div>
<input type="file" id="lyricFile" accept=".txt,.lrc" hidden>
<div id="uploadStatus" class="hidden flex items-center gap-2 mt-2 px-1">
<span class="material-symbols-outlined text-base text-primary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span id="uploadStatusText" class="font-body-sm text-body-sm text-primary opacity-90"></span>
</div>
</div>
<div class="flex flex-col">
<label class="font-body-md text-body-md font-medium text-primary mb-2" for="whisper-model">Model Whisper</label>
<div class="relative w-full">
<select class="w-full h-14 pl-4 pr-10 text-base font-body-md text-primary bg-surface-container-lowest rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition cursor-pointer" id="whisper-model" name="model">
{% for m in models %}
<option value="{{ m }}" {% if m == 'large-v3-turbo' %}selected{% endif %}>{{ m }}{% if m == 'large-v3-turbo' %} (Direkomendasikan){% endif %}</option>
{% endfor %}
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-primary">expand_more</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col">
<label class="font-body-md text-body-md font-medium text-primary mb-2 flex items-center justify-between" for="offset-input"><span>Offset (detik)</span><span class="text-xs font-normal text-on-surface-variant">opsional</span></label>
<input class="w-full h-14 px-4 text-base font-body-md text-primary bg-surface-container-lowest rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition placeholder:text-on-surface-variant/50" id="offset-input" name="offset" placeholder="0.00" type="text">
</div>
<div class="flex flex-col">
<label class="font-body-md text-body-md font-medium text-primary mb-2 flex items-center justify-between" for="start-time-input"><span>Mulai dari waktu</span><span class="text-xs font-normal text-on-surface-variant">opsional</span></label>
<input class="w-full h-14 px-4 text-base font-body-md text-primary bg-surface-container-lowest rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition placeholder:text-on-surface-variant/50" id="start-time-input" name="mulai_dari" placeholder="mm:ss.mmm" type="text">
</div>
</div>
<div class="flex flex-col">
<label class="font-body-md text-body-md font-medium text-primary mb-2 flex items-center justify-between" for="override-title"><span>Override Judul</span><span class="text-xs font-normal text-on-surface-variant">opsional</span></label>
<input class="w-full h-14 px-4 text-base font-body-md text-primary bg-surface-container-lowest rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition placeholder:text-on-surface-variant/50" id="override-title" name="judul" placeholder="Judul lagu kustom..." type="text">
</div>
<div class="flex flex-col">
<label class="font-body-md text-body-md font-medium text-primary mb-2 flex items-center justify-between" for="whisper-prompt"><span>Prompt Whisper</span><span class="text-xs font-normal text-on-surface-variant">opsional</span></label>
<textarea class="w-full p-3.5 text-base font-body-md text-primary bg-surface-container-lowest rounded-xl border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition placeholder:text-on-surface-variant/50 resize-none" id="whisper-prompt" name="prompt" placeholder="Kamus fonetik atau panduan kata-kata unik..." rows="3"></textarea>
</div>
<div class="flex flex-col gap-4 pt-1">
<label class="flex items-start justify-between cursor-pointer select-none">
<div class="flex flex-col pr-4">
<span class="font-body-md text-body-md font-medium text-primary">Pisah vokal (Demucs)</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Isolasi vokal dari instrumen untuk akurasi optimal.</span>
</div>
<input class="sr-only peer" id="toggle-demucs" name="pisah_vokal" type="checkbox">
<div class="relative w-12 h-7 bg-outline-variant rounded-full peer peer-checked:bg-secondary-container transition-colors flex-shrink-0 mt-0.5"><div class="absolute left-1 top-1 bg-surface-container-lowest w-5 h-5 rounded-full transition-transform peer-checked:translate-x-5 shadow-sm"></div></div>
</label>
<label class="flex items-start justify-between cursor-pointer select-none">
<div class="flex flex-col pr-4">
<span class="font-body-md text-body-md font-medium text-primary">Rapikan draft lirik dengan LLM</span>
<span class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">Koreksi tanda baca dan sinkronisasi otomatis.</span>
</div>
<input class="sr-only peer" id="toggle-llm" name="rapikan" type="checkbox">
<div class="relative w-12 h-7 bg-outline-variant rounded-full peer peer-checked:bg-secondary-container transition-colors flex-shrink-0 mt-0.5"><div class="absolute left-1 top-1 bg-surface-container-lowest w-5 h-5 rounded-full transition-transform peer-checked:translate-x-5 shadow-sm"></div></div>
</label>
</div>
<div class="pt-4 pb-6">
<button class="w-full h-14 rounded-full bg-primary text-on-primary font-body-lg text-body-lg font-medium flex items-center justify-center gap-2 hover:bg-neutral-800 transition active:scale-[0.99] cursor-pointer" id="btnGenerate" type="button">
<span id="btnGenerateText">Generate TTML</span>
<span class="material-symbols-outlined text-xl" id="btnGenerateIcon">arrow_forward</span>
<span class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" id="btnSpinner"></span>
</button>
</div>
</div>
<!-- VIEW PROGRESS -->
<div class="hidden flex-col gap-6 w-full" id="view-progress">
<div class="bg-surface-container-low p-6 rounded-xl flex flex-col gap-4">
<div class="flex items-center justify-between">
<span class="font-label-caps text-label-caps uppercase tracking-wider text-primary">Status Pipeline</span>
<span class="font-code-timecode text-code-timecode text-secondary font-medium" id="stepIndicator">IDLE</span>
</div>
<p class="font-headline-md text-headline-md font-semibold text-primary" id="progressTitle">Menunggu...</p>
<p class="font-body-sm text-body-sm text-on-surface-variant" id="progressDesc">Tekan Generate untuk memulai.</p>
<div class="w-full bg-outline-variant/30 h-2 rounded-full overflow-hidden mt-2">
<div class="bg-secondary-container h-full w-0 rounded-full transition-all duration-300" id="progressBar"></div>
</div>
<div class="flex justify-between items-center text-xs font-code-timecode text-on-surface-variant">
<span id="progressPercent">0%</span>
<span id="progressState">Idle</span>
</div>
</div>
<div class="bg-primary text-surface p-5 rounded-xl font-code-timecode text-xs leading-relaxed overflow-x-auto space-y-1 min-h-[200px] max-h-[360px] overflow-y-auto" id="terminalBox">
<p class="text-neutral-400">Menunggu perintah...</p>
</div>
</div>
<!-- VIEW HASIL -->
<div class="hidden flex-col gap-6 w-full" id="view-hasil">
<div id="hasilEmpty" class="p-6 bg-surface-container-low rounded-xl flex flex-col gap-3 text-center">
<span class="font-label-caps text-label-caps uppercase tracking-wider text-primary">Belum ada hasil</span>
<p class="font-body-sm text-body-sm text-on-surface-variant">Generate TTML terlebih dahulu.</p>
</div>
<div id="hasilContent" class="hidden flex-col gap-6 w-full">
<div class="p-6 bg-surface-container-low rounded-xl flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="text-xs font-code-timecode text-primary uppercase font-bold tracking-wider">TTML Generated</span>
</div>
<h3 class="font-headline-md text-headline-md font-semibold text-primary" id="hasilTitle">-</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant" id="hasilMeta">-</p>
</div>
<div class="p-5 rounded-xl outline outline-1 outline-outline-variant bg-surface-container-lowest flex flex-col gap-3 font-code-timecode text-sm max-h-[320px] overflow-y-auto" id="hasilPreview">
</div>
<div class="flex flex-col gap-3 pt-2">
<a id="downloadLink" href="#" class="w-full h-14 rounded-full bg-primary text-on-primary font-body-lg text-body-lg font-medium flex items-center justify-center gap-2 hover:bg-neutral-800 transition cursor-pointer text-center">
<span class="material-symbols-outlined text-xl">download</span>
<span>Unduh File .ttml</span>
</a>
<button class="w-full h-14 rounded-full outline outline-1 outline-outline-variant text-primary font-body-lg text-body-lg font-medium flex items-center justify-center gap-2 hover:bg-neutral-50 transition cursor-pointer" onclick="switchTab('generate')" type="button">Sync Lagu Baru</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
